<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NOFA — Finance Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E63E7'/%3E%3Cpath d='M6 23 12 10l4.5 7L20 11l6 12' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='7' r='2' fill='white'/%3E%3C/svg%3E" />
<!-- Fonts are progressive enhancement: if blocked, system fallbacks keep the layout intact -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Spline+Sans+Mono:wght@400..700&display=swap" rel="stylesheet" />

<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --navy:#0A1526; --ink:#101E33; --paper:#F4F6F9; --line:#E7EBF1;
  --b50:#EEF3FE;--b100:#DCE7FD;--b200:#BCD0FB;--b300:#9DBAFF;--b400:#5F8DFF;--b500:#2E63E7;--b600:#1F4FC4;
  --g50:#F3F0FE;--g100:#E9E3FD;--g300:#C0A9FB;--g400:#9A78F8;--g500:#7550F0;--g600:#5B36D6;
  --l50:#E9F9F0;--l100:#D2F2E1;--l300:#6FDBA3;--l400:#3ECF87;--l500:#2FBF71;--l600:#1F9E5C;
  --c50:#FDF1F3;--c100:#FBDCE3;--c300:#F093AA;--c400:#E86E8C;--c500:#E85D75;--c600:#D4405E;
  --sans:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --shadow-card:0 1px 2px rgba(16,30,51,.05),0 14px 34px -16px rgba(16,30,51,.14);
  --shadow-pop:0 24px 60px -12px rgba(10,21,38,.38);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;text-align:left}
input,select{font:inherit}
svg{display:block}
::selection{background:var(--b100)}
.mono{font-family:var(--mono)}
.minw0{min-width:0}
.fcol{display:flex;flex-direction:column}
.hfull{height:100%}
.grow{flex:1}
.push{margin-top:auto}
.mb5{margin-bottom:20px}
.mt5{margin-top:20px}
.mtop{margin-top:14px}
.vstack{display:flex;flex-direction:column;gap:20px}
#errbar{display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:#7F1D1D;color:#fff;padding:10px 16px;font-size:12px;gap:10px;align-items:center}

/* ============ ANIMATIONS ============ */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.965) translateY(8px)}}
@keyframes toastin{from{opacity:0;transform:translateX(14px)}}
@keyframes twinkle{from{opacity:.15}to{opacity:.9}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.4);opacity:0}}
.reveal{animation:rise .55s var(--ease) backwards}
.view-enter{animation:rise .4s var(--ease) backwards}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.16s}.d4{animation-delay:.22s}.d5{animation-delay:.28s}.d6{animation-delay:.34s}
.star{animation:twinkle 3.6s ease-in-out infinite alternate}

/* ============ LAYOUT ============ */
.main{min-width:0}
@media(min-width:1024px){.main{margin-left:268px}}
.page{max-width:1280px;margin:0 auto;padding:24px 16px}
@media(min-width:640px){.page{padding:28px 24px}}
@media(min-width:1024px){.page{padding:32px 40px}}
.row12{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:1024px){.row12{grid-template-columns:repeat(12,1fr)}
  .c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}}
.grid2{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:1024px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.grid3{grid-template-columns:1fr 1fr}}
@media(min-width:1280px){.grid3{grid-template-columns:repeat(3,1fr)}}

/* ============ SIDEBAR ============ */
.sb-backdrop{position:fixed;inset:0;z-index:40;background:rgba(16,30,51,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.sb-backdrop.show{opacity:1;pointer-events:auto}
@media(min-width:1024px){.sb-backdrop{display:none}}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:268px;z-index:50;background:var(--navy);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s var(--ease)}
.sidebar.open{transform:none}
@media(min-width:1024px){.sidebar{transform:none}}
.sb-brand{display:flex;gap:14px;align-items:center;padding:28px 24px 20px}
.sb-name{color:#fff;font-weight:600;font-size:17px;letter-spacing:.18em}
.sb-tag{font-size:10px;color:#94A3B8;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.sb-tag .dim{color:#475569}
.sb-menu-label{padding:0 24px 8px;font-size:10px;letter-spacing:.24em;color:#64748B;font-weight:600}
.sb-nav{padding:0 12px;flex:1;overflow-y:auto;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:4px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.sb-item{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:500;color:#94A3B8;transition:all .2s}
.sb-item:hover{color:#E2E8F0;background:rgba(255,255,255,.04)}
.sb-item.active{color:#fff;background:rgba(255,255,255,.07)}
.sb-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--b400)}
.sb-item svg{color:#64748B;transition:color .2s;flex-shrink:0}
.sb-item:hover svg{color:#CBD5E1}
.sb-item.active svg{color:var(--b300)}
.sb-bottom{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.sb-quote{border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:16px}
.sb-quote .q{font-family:var(--serif);font-size:28px;color:rgba(157,186,255,.8);line-height:1;height:16px;display:block}
.sb-quote p{margin-top:6px;font-style:italic;color:#CBD5E1;font-size:12.5px;line-height:1.55}
.sb-ver{text-align:center;font-size:10px;color:#475569;letter-spacing:.05em}
.logo{display:grid;place-items:center;border-radius:12px;color:#fff;background:linear-gradient(135deg,#1F4FC4,#4C7DFF);box-shadow:0 4px 12px rgba(31,79,196,.35);flex-shrink:0}

/* ============ TOPBAR (mobile) ============ */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:rgba(244,246,249,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
@media(min-width:1024px){.topbar{display:none}}
.tb-name{flex:1;font-weight:600;letter-spacing:.2em;font-size:14px}
.tb-menu{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;transition:background .2s}
.tb-menu:hover{background:rgba(203,213,225,.6)}
.avatar{border-radius:999px;background:linear-gradient(135deg,var(--b400),var(--g400));display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}
.av40{width:40px;height:40px;font-size:13px}.av36{width:36px;height:36px;font-size:12px}.av56{width:56px;height:56px;font-size:20px;border-radius:18px}

/* ============ CARDS / BUTTONS / CHIPS ============ */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-card)}
.pad{padding:20px}
@media(min-width:640px){.pad{padding:24px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;transition:all .25s var(--ease)}
.btn.primary{background:var(--b500);color:#fff;box-shadow:0 4px 14px rgba(46,99,231,.3)}
.btn.primary:hover{background:var(--b400)}
.btn.primary:active{transform:scale(.98)}
.btn.ghost{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.ghost:hover{border-color:var(--b300);color:var(--b600)}
.btn.wide{width:100%}
.act{display:inline-flex;align-items:center;gap:6px;border-radius:10px;border:1px solid var(--line);padding:6px 10px;font-size:12px;font-weight:500;color:#64748B;transition:all .2s}
.act:hover{border-color:var(--b300);color:var(--b600)}
.act.danger{border-color:var(--c100);color:var(--c600)}
.act.danger:hover{border-color:var(--c300);color:var(--c500)}
.tile{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile.brand{background:var(--b50);color:var(--b600)}
.tile.grape{background:var(--g50);color:var(--g600)}
.tile.leaf{background:var(--l50);color:var(--l600)}
.tile.coral{background:var(--c50);color:var(--c600)}
.tile.slate{background:#F1F5F9;color:#64748B}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.chip.nofa{background:var(--b50);color:var(--b600)}
.chip.personal{background:var(--g50);color:var(--g600)}
.chip.muted{background:#F1F5F9;color:#64748B}
.chip.leaf{background:var(--l50);color:var(--l600)}
.chip.amber{background:#FEF3C7;color:#B45309}
.chip.coral{background:var(--c50);color:var(--c600)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chead-l{display:flex;align-items:center;gap:10px;min-width:0}
.chead-t{font-size:15px;font-weight:600;line-height:1.2}
.chead-s{font-size:11.5px;color:#64748B;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewall{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--b600);flex-shrink:0}
.viewall:hover{color:var(--b500)}

/* ============ FORMS ============ */
.flabel{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#64748B;margin-bottom:6px}
.field{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;padding:10px 14px;font-size:14px;color:var(--ink);transition:all .2s}
.field:focus{outline:none;border-color:var(--b400);box-shadow:0 0 0 3px rgba(157,186,255,.35)}
.field::placeholder{color:#94A3B8}
.sfield{position:relative}
.sfield .sic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94A3B8;display:flex;pointer-events:none}
.sfield .field{padding-left:40px}
.moneyfield{position:relative}
.moneyfield>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:14px;pointer-events:none}
.moneyfield .field{padding-left:28px}
.formrow{display:grid;gap:16px}
.formrow2{grid-template-columns:1fr}
@media(min-width:480px){.formrow2{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;border-radius:12px;border:1px solid var(--line);background:#fff;padding:4px}
.seg button{padding:6px 14px;border-radius:9px;font-size:12.5px;font-weight:500;color:#64748B;transition:all .2s}
.seg button.on{background:var(--ink);color:#fff}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{border-radius:12px;border:1px solid var(--line);padding:10px 12px;font-size:13px;font-weight:500;color:#64748B;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.seg2 button.on{border-color:var(--b400);background:var(--b50);color:var(--b600)}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border-radius:999px;padding:6px 14px;font-size:12px;font-weight:500;background:#fff;border:1px solid var(--line);color:#64748B;transition:all .2s}
.fchip:hover{border-color:#CBD5E1}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ============ MODAL / TOAST ============ */
.modal-backdrop{position:fixed;inset:0;z-index:70;background:rgba(16,30,51,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s both}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:24px}}
.modal{position:relative;width:100%;max-width:448px;background:#fff;border-radius:24px 24px 0 0;box-shadow:var(--shadow-pop);max-height:92vh;overflow-y:auto;animation:pop .28s var(--ease) both}
@media(min-width:640px){.modal{border-radius:24px}}
.minner{padding:24px}
@media(min-width:640px){.minner{padding:28px}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.mhead h3{font-size:19px;font-weight:600}
.mhead .msub{margin-top:4px;font-size:12.5px;color:#64748B}
.mclose{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#94A3B8;transition:all .2s;flex-shrink:0}
.mclose:hover{background:var(--paper);color:var(--ink)}
.mbody{margin-top:20px}
.mform{display:flex;flex-direction:column;gap:16px}
.mactions{display:flex;gap:10px;padding-top:8px}
.mactions .btn{flex:1}
.mdanger{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px 12px 14px;font-size:13px;box-shadow:var(--shadow-pop);animation:toastin .3s var(--ease) both}
.toast .tleaf{color:var(--l400)}.toast .tcoral{color:var(--c300)}
.toast.out{opacity:0;transform:translateX(14px);transition:all .3s}

/* ============ PAGE HEADER ============ */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:24px}
.phead h1{font-size:27px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
@media(min-width:640px){.phead h1{font-size:31px}}
.phead .it{font-family:var(--serif);font-style:italic;font-weight:400}
.phead .sub{margin-top:8px;font-size:13.5px;color:#64748B}
.phead .pact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--navy);color:#fff;min-height:320px;display:flex;align-items:center}
@media(min-width:1024px){.hero{min-height:350px}}
.hero-scene{position:absolute;inset:0;width:100%;height:100%}
.hero-scene g{transition:transform .25s ease-out}
.hero-grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:soft-light;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.hero-body{position:relative;z-index:10;padding:28px 28px 64px;max-width:680px}
@media(min-width:640px){.hero-body{padding:40px 40px 80px}}
@media(min-width:1024px){.hero-body{padding:48px 48px 88px}}
.greet{font-family:var(--serif);font-style:italic;font-size:19px;color:rgba(255,255,255,.85)}
@media(min-width:640px){.greet{font-size:21px}}
.hero h1{margin-top:4px;font-size:32px;line-height:1.05;font-weight:600;letter-spacing:-.01em;color:#fff}
@media(min-width:640px){.hero h1{font-size:40px}}
@media(min-width:1024px){.hero h1{font-size:44px}}
.hero h1 .it{font-family:var(--serif);font-style:italic;font-weight:400}
.hero-sub{margin-top:14px;font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.55)}
@media(min-width:640px){.hero-sub{font-size:12px}}
.hero-sub b{color:rgba(255,255,255,.92);font-weight:600}
.hero-sub i{font-style:normal;color:rgba(255,255,255,.3);padding:0 5px}
.hero-chips{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:6px 12px;font-size:12px;color:rgba(255,255,255,.88)}
.hchip.hidesm{display:none}
@media(min-width:640px){.hchip.hidesm{display:inline-flex}}
.hero-side{position:absolute;top:24px;right:24px;z-index:10;display:flex;align-items:center;gap:12px}
@media(min-width:640px){.hero-side{top:28px;right:32px}}
.hero-date{text-align:right;line-height:1.3;margin-right:4px}
.hero-date .d1{font-size:11px;color:rgba(255,255,255,.5);font-weight:500}
.hero-date .d2{font-size:13px;color:rgba(255,255,255,.85);font-weight:600}
.bellbtn{position:relative;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:grid;place-items:center;color:rgba(255,255,255,.85);transition:background .2s}
.bellbtn:hover{background:rgba(255,255,255,.2)}
.bellbtn i{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:999px;background:var(--l400)}
.avwrap{position:relative}
.avwrap .sdot{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:999px;background:var(--l400);border:2px solid var(--navy)}

/* ============ KPI ============ */
.kpis{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.kpis{grid-template-columns:1fr 1fr}}
@media(min-width:1280px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-card);padding:20px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;transition:transform .3s,box-shadow .3s,border-color .3s}
@media(min-width:640px){.kpi{padding:24px}}
.kpi:hover{transform:translateY(-3px);box-shadow:0 16px 36px -14px rgba(16,30,51,.22);border-color:var(--b200)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;width:100%}
.klbl{margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#64748B}
.kval{margin-top:6px;font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1}
.ksub{margin-top:8px;font-size:12px;color:#64748B}
.pulse{position:relative;width:8px;height:8px;margin-top:8px;flex-shrink:0}
.pulse i{position:absolute;inset:0;border-radius:999px;background:var(--l500)}
.pulse i:first-child{animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}

/* ============ ENTITY GRADIENT CARDS ============ */
.duo{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:1024px){.duo{grid-template-columns:1fr 1fr}}
.entity{position:relative;overflow:hidden;border-radius:24px;color:#fff;padding:26px;transition:transform .3s,box-shadow .3s;cursor:pointer}
.entity:hover{transform:translateY(-3px);box-shadow:var(--shadow-pop)}
.entity.business{background:linear-gradient(135deg,#1B44B8,#2E63E7 55%,#4C7DFF)}
.entity.personal{background:linear-gradient(135deg,#4A2BB8,#6C4AF0 55%,#9A78F8)}
.entity .glow{position:absolute;top:-96px;right:-64px;width:288px;height:288px;border-radius:999px;background:rgba(255,255,255,.13);filter:blur(40px);pointer-events:none}
.entity .ridge{position:absolute;bottom:0;right:0;width:250px;opacity:.12;pointer-events:none}
.entity .in{position:relative;z-index:10}
.e-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.e-chip{display:inline-flex;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.e-trend{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;border-radius:999px;padding:4px 10px}
.e-trend.up{background:rgba(62,207,135,.2);color:#A9E6C6}

/* ================================================================
   STATE
   Financial Truth Phase A: schema upgrades NEVER discard existing data.
   loadStore() migrates old-shape data in place (backup + backfill +
   verify) instead of resetting to SEED on a version mismatch, which was
   the prior (destructive) behavior.
================================================================ */
function sumBalances(store) { return (store.accounts || []).reduce(function (s, a) { return s + (a.balance || 0); }, 0); }

}

  var oldVersion = oldStore.v;
  /* 1) Back up the complete pre-migration state before touching anything. */
  try { localStorage.setItem(STORE_KEY + '-backup-v' + (oldVersion != null ? oldVersion : 'unknown') + '-' + Date.now(), rawJson); } catch (e) {}
  var before = { balance: sumBalances(oldStore), counts: countRecords(oldStore) };
  var migrated = JSON.parse(JSON.stringify(oldStore));
  /* 2) Backfill new Financial Truth fields with safe, non-mutating defaults.
     Pre-existing transactions/transfers are treated as already covered by
     the user's current account balances (like an implicit reconciliation),
     so they are marked includedInBalance:true but balanceApplied:false --
     they must never be (re)applied. */
  (migrated.transactions || []).forEach(function (t) {
    if (t.includedInBalance === undefined) t.includedInBalance = true;
    if (t.balanceApplied === undefined) t.balanceApplied = false;
    if (t.reconciliationId === undefined) t.reconciliationId = null;
  });
  (migrated.ownerTransfers || []).forEach(function (t) {
    if (t.balanceApplied === undefined) t.balanceApplied = false;
    if (t.includedInBalance === undefined) t.includedInBalance = true;
    if (t.fromAccountId === undefined) t.fromAccountId = firstAccountIdByEntity(migrated, t.direction === 'personal_to_nofa' ? 'personal' : 'business');
    if (t.toAccountId === undefined) t.toAccountId = firstAccountIdByEntity(migrated, t.direction === 'personal_to_nofa' ? 'business' : 'personal');
    /* Known historical correction: the original $732.39 NOFA->Personal owner
       withdrawal already happened and is already reflected in current
       balances. It must be historical/completed, never a future plan, and
       must never be (re)applied. */
    if (t.status === 'planned' && t.direction === 'nofa_to_personal' && Math.abs((t.amount || 0) - 732.39) < 0.005) {
      t.status = 'completed'; t.balanceApplied = false; t.includedInBalance = true;
    }
  });
  (migrated.accounts || []).forEach(function (a) {
    if (a.lastReconciledAt === undefined) a.lastReconciledAt = null;
    /* Known historical correction: Business Market Rate Savings belongs to
       Other Business, not NOFA. */
    if (a.id === 'a3' && a.entity === 'business') a.entity = 'other_business';
  });
  if (!Array.isArray(migrated.balanceReconciliations)) migrated.balanceReconciliations = [];
  if (!Array.isArray(migrated.balanceSnapshots)) migrated.balanceSnapshots = [];

  var after = { balance: sumBalances(migrated), counts: countRecords(migrated) };
  var ok = Math.abs(after.balance - before.balance) < 0.005 &&
    after.counts.accounts === before.counts.accounts &&
    after.counts.transactions === before.counts.transactions &&
    after.counts.ownerTransfers === before.counts.ownerTransfers;

    try { reportUiError('Data migration check failed \u2014 kept your existing data untouched', new Error('balance/record count mismatch during migration')); } catch (e) {}

}

/* ================================================================
   BALANCE APPLY / REVERSE ENGINE — Financial Truth Phase A
   A transaction or owner transfer only ever changes an account
   balance once. balanceApplied tracks whether THIS engine has
   already added its signed amount to the account; every reversal
   checks that flag first so double-counting is structurally
   impossible, and reconciled/imported history (balanceApplied:false)
   is never touched.
================================================================ */

  var a = findAcct(accountId);
  if (a) a.balance += amount;
}

  if (tx && tx.balanceApplied) {
    applyAmountToAccount(tx.accountId, -tx.amount);
    tx.balanceApplied = false;
  }
}
/* Applies (or withholds) a transaction's amount based on the user's
   "already included" declaration and posted/pending status. For
   edits, call reverseTransactionApply(tx) FIRST (using the OLD
   accountId/amount), mutate the fields, then call this (using the
   NEW values) so the net effect is a clean reverse-then-reapply. */
function computeTransactionApply(tx, alreadyIncluded) {
  if (alreadyIncluded) {
    /* Declared as already reflected in the account's current balance
       (e.g. a bank screenshot whose shown balance already includes
       it) — must never be applied, exactly like a reconciliation
       baseline. */
    tx.includedInBalance = true;
    tx.balanceApplied = false;
  } else if (tx.status === 'posted') {
    applyAmountToAccount(tx.accountId, tx.amount);
    tx.includedInBalance = true;
    tx.balanceApplied = true;
  } else {
    tx.includedInBalance = false;
    tx.balanceApplied = false;
  }
}
function reverseOwnerTransferApply(t) {
  if (t && t.balanceApplied) {
    applyAmountToAccount(t.fromAccountId, t.amount);
    applyAmountToAccount(t.toAccountId, -t.amount);
    t.balanceApplied = false;
  }
}

  if (t.status === 'completed' && !t.balanceApplied && t.fromAccountId && t.toAccountId) {
    applyAmountToAccount(t.fromAccountId, -t.amount);
    applyAmountToAccount(t.toAccountId, t.amount);
    t.balanceApplied = true;
    t.includedInBalance = true;
  }
}

function upsertTodaySnapshot() {

  var accounts = active.map(function (a) { return { id: a.id, balance: a.balance }; });
  var business = active.filter(function (a) { return a.entity === 'business'; }).reduce(function (s, a) { return s + a.balance; }, 0);
  var personal = active.filter(function (a) { return a.entity === 'personal'; }).reduce(function (s, a) { return s + a.balance; }, 0);
  var otherBusiness = active.filter(function (a) { return a.entity === 'other_business'; }).reduce(function (s, a) { return s + a.balance; }, 0);
  /* total must reflect ALL active accounts, not just business+personal. */
  var total = active.reduce(function (s, a) { return s + a.balance; }, 0);
  var last = list[list.length - 1];

    last.accounts = accounts; last.total = total; last.business = business; last.personal = personal; last.otherBusiness = otherBusiness;

    list.push({ id: 'bal-' + Date.now(), date: d, accounts: accounts, total: total, business: business, personal: personal, otherBusiness: otherBusiness, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });

/* Standard pay-periods-per-year for known cadences, used instead of a naive

   biweekly income: 30/14 = 2.143 payments/month, but a true biweekly cadence
   is 26 pay periods/year \u00f7 12 = 2.1667 payments/month. Monthly (30) and
   weekly (7) also get their conventional 12 and 52 periods/year. Cadences
   with no fixed recurrence (One-off/Variable, cadenceDays null) contribute
   nothing to a recurring monthly projection. */

  if (!cadenceDays) return 0;

/* Returns { low, high, mid } monthly-equivalent totals across all confirmed +

function monthlyIncomeBaseline() {

  state.store.incomeSources.filter(function (s) { return s.cashStatus === 'confirmed' || s.cashStatus === 'expected'; }).forEach(function (s) {
    var factor = cadenceMonthlyFactor(s.cadenceDays);

      high += s.amount * factor;

/* ================================================================

   available cash - confirmed outflows - scheduled obligations

   Only forward-looking scheduled items are added; current account
   balances are assumed to already reflect posted + pending activity,
   so pending transactions are never subtracted a second time here.

      var d = daysBetween(base, occ);
      if (d >= 0 && d <= horizonDays) events.push({ d: d, amount: -Math.abs(r.amount), label: r.name, entity: entity, kind:'recurring' });
    });
  });
  state.store.incomeSources.filter(function (s) { return s.cashStatus === 'confirmed' && s.nextDate; }).forEach(function (s) {
    var occ = parseISO(s.nextDate), d = daysBetween(base, occ);
    if (d >= 0 && d <= horizonDays) events.push({ d: d, amount: Math.abs(s.amount || 0), label: s.name, entity: s.entity || 'business', kind:'income' });
  });
  state.store.ownerTransfers.filter(function (t) { return t.status === 'planned' && t.date; }).forEach(function (t) {
    var occ = parseISO(t.date), d = daysBetween(base, occ);
    if (d >= 0 && d <= horizonDays) {

function computeKnownForecast(horizonDays) {
  var start = state.store.accounts.filter(function (a) { return !a.archived; }).reduce(function (s, a) { return s + a.balance; }, 0);
  var events = scheduledEvents(horizonDays);
  var byDay = {};
  events.forEach(function (e) { byDay[e.d] = (byDay[e.d] || 0) + e.amount; });
  var bal = [start];
  for (var d = 1; d <= horizonDays; d++) bal.push(bal[d - 1] + (byDay[d] || 0));

function fcGeom(days) {
  var f = computeKnownForecast(days);
  var W = 760, H = 216, PL = 14, PR = 14, PT = 26, PB = 26;
  var lo = Math.min.apply(null, f.bal), hi = Math.max.apply(null, f.bal), pad = (hi - lo) * .08 || 10;
  var y0 = lo - pad, y1 = hi + pad;
  return {
    f: f, W: W, H: H, PL: PL, PR: PR, PT: PT, PB: PB,
    X: function (i) { return PL + (i / days) * (W - PL - PR); },
    Y: function (v) { return H - PB - ((v - y0) / (y1 - y0)) * (H - PT - PB); },
    grid: [y0, (y0 + y1) / 2, y1]
  };
}
function forecastChartHTML(days) {

      '<text x="' + G.PL + '" y="' + (G.Y(v) - 5).toFixed(1) + '" font-size="9" fill="#9AA6B5" font-family="Spline Sans Mono,monospace">' + money(v, 0) + '</text>';
  }).join('');
  var markers = evs.map(function (e, i) {
    return '<circle cx="' + (G.X(e.d) + (i % 2 ? 4 : -4)).toFixed(1) + '" cy="' + G.Y(G.f.bal[e.d]).toFixed(1) + '" r="' + (e.amount > 0 ? 4 : 3.5) + '" fill="' + (e.amount > 0 ? '#2FBF71' : '#E85D75') + '" stroke="#fff" stroke-width="1.5"/>';
  }).join('');
  return '<div class="fcwrap" data-days="' + days + '">' +
    '<svg viewBox="0 0 ' + G.W + ' ' + G.H + '">' +
    '<defs><linearGradient id="' + gid + 'a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E63E7" stop-opacity=".26"/><stop offset="1" stop-color="#2E63E7" stop-opacity="0"/></linearGradient>' +

    markers +
    ticks.map(function (i) { return '<text x="' + G.X(i).toFixed(1) + '" y="' + (G.H - 7) + '" text-anchor="middle" font-size="9.5" fill="#8A96A6">' + dlabel(i) + '</text>'; }).join('') +

function txBodyHTML() {

  }).sort(function (a, b) { return b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)); });

/* ================================================================

================================================================ */
function forecastView() {
  var st = state.store;
  var h = state.horizon;
  var f = computeKnownForecast(h);
  var evs = f.events.filter(function (e) { return e.d >= 1 && e.d <= h; });
  var reserve = st.goals[0];
  var reservePct = Math.round(Math.min(reserve.current / Math.max(reserve.target, 1), 1) * 100);
  var planned = st.ownerTransfers.filter(function (t) { return t.status === 'planned'; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
  var nextPlanned = planned[0];
  return pageHeader('Forecast', null, 'Projected cash position \u00b7 ' + fmtShort(todayISO()) + ' onward',
      '<div class="seg">' + [7, 15, 30].map(function (x) {
        return '<button class="' + (h === x ? 'on' : '') + '" data-action="horizon" data-h="' + x + '">' + x + ' days</button>';
      }).join('') + '</div>') +
    '<div class="kpis mb5">' +
    kpi({ tint:'leaf', icon:'trend', label:'Projected inflow', val:money(f.inflow), sub:evs.filter(function (e) { return e.amount > 0; }).length + ' income events' }) +
    kpi({ tint:'coral', icon:'swap', label:'Projected outflow', val:money(f.outflow), sub:evs.filter(function (e) { return e.amount < 0; }).length + ' obligations' }) +
    kpi({ tint:'brand', icon:'chart', label:'Net over period', val:(f.net >= 0 ? '+' : '\u2212') + money(Math.abs(f.net)), sub:f.net >= 0 ? 'Cash holding steady' : 'Planned drawdown' }) +
    kpi({ tint:'grape', icon:'wallet', label:'Balance \u00b7 ' + dlabel(h), val:money(f.end, 0), sub:'From current position' }) +
    '</div>' +
    '<div class="card pad mb5">' + cardHead('calendar', 'brand', 'Projected cash position', 'Hover the line to inspect any day') +
    forecastChartHTML(h) + '</div>' +
    '<div class="row12">' +
    '<div class="c7"><div class="card pad">' + cardHead('clock', 'slate', 'Event timeline', evs.length + ' events in the next ' + h + ' days') +
    '<div class="rows">' + (evs.length ? evs.map(function (e) {
      return '<div class="rowitem"><span class="datechip">' + dlabel(e.d) + '</span>' +
        '<div class="rowmain"><p class="rowt">' + esc(e.label) + '</p></div>' +
        '<span class="chip ' + (e.entity === 'business' ? 'nofa' : e.entity === 'personal' ? 'personal' : 'muted') + '">' + (e.entity === 'business' ? 'NOFA' : e.entity === 'personal' ? 'Personal' : 'Mixed') + '</span>' +
        '<p class="amt ' + (e.amount > 0 ? 'pos' : e.amount < 0 ? 'neg' : '') + '" style="width:86px;text-align:right">' + (e.kind === 'owner-transfer' ? money(e.transferAmount) : (e.amount > 0 ? '+' : '\u2212') + money(Math.abs(e.amount))) + '</p></div>';
    }).join('') : '<p class="nomatch">No scheduled events in this window.</p>') + '</div></div></div>' +
    '<div class="c5 vstack">' +
    '<div class="card pad">' + cardHead('bank', 'brand', 'Owner Withdrawal Planning', 'Tracked separately from operating expenses') +
    '<p class="mono" style="margin-top:16px;font-size:30px;font-weight:600;line-height:1">' + (nextPlanned ? money(nextPlanned.amount) : '$0') + '</p>' +
    '<p style="font-size:12px;color:#64748B;margin-top:6px">' + (nextPlanned ? 'Planned for ' + fmtShort(nextPlanned.date) : 'No withdrawal currently planned') + '</p>' +
    '<p style="margin-top:16px;font-size:13px;color:#475569;line-height:1.65">NOFA Operating Reserve is currently <b style="color:var(--ink)">' + reservePct + '% funded</b> (' + money(reserve.current, 0) + ' of ' + money(reserve.target, 0) + ').</p>' +

================================================================ */
function goalStatus(g) {
  if (g.mode === 'spend') return { l: 'Under control', c: 'leaf' };
  var p = g.current / g.target * 100;
  if (p >= 75) return { l: 'On track', c: 'leaf' };
  if (p >= 45) return { l: 'Building', c: 'amber' };
  return { l: 'Needs attention', c: 'coral' };
}
function goalCard(g, i) {
  var c = RING[g.color] || RING.brand;
  var p = Math.min(g.current / g.target * 100, 100);
  var st = goalStatus(g);
  return '<div class="card pad goalcard">' +
    ringHTML(p, 96, 10, c[0], c[1], '<span class="rv">' + Math.round(p) + '%</span><span class="rl">' + (g.mode === 'spend' ? 'used' : 'funded') + '</span>', i * 110) +
    '<div class="gmain"><div class="gtop"><div class="minw0"><p class="gname">' + esc(g.name) + '</p>' + (g.note ? '<p class="gnote">' + esc(g.note) + '</p>' : '') + '</div>' +
    '<span class="chip ' + st.c + '">' + st.l + '</span></div>' +
    '<p class="gvals"><b>' + money(g.current) + '</b> ' + (g.mode === 'spend' ? 'used of' : 'saved of') + ' <span class="mono">' + money(g.target, 0) + '</span>' +
    (g.mode === 'spend' ? ' <span>\u00b7 ' + money(g.target - g.current, 0) + ' left</span>' : '') + '</p>' +
    '<button class="act mtop" data-action="modal" data-modal="edit-goal" data-id="' + g.id + '">' + ic('pencil', 13) + 'Edit goal</button></div></div>';
}

================================================================ */
function addAccount(a) {
  a.id = 'a' + Date.now(); a.archived = false; a.spark = genSpark(Date.now());
  state.store.accounts.push(a); persist();
  toast('Account \u201c' + esc(a.name) + '\u201d added');
}
function deleteAccount(id) {
  var a = findAcct(id); if (!a) return;
  state.store.accounts = state.store.accounts.filter(function (x) { return x.id !== id; });
  persist(); toast('\u201c' + esc(a.name) + '\u201d deleted', 'trash');
}

/* ================================================================
   POST-RENDER EFFECTS (rings, parallax, forecast hover)
================================================================ */
function bindEffects(anim) {
  var rings = document.querySelectorAll('.ringfg');
  for (var i = 0; i < rings.length; i++) {
    (function (c) {
      var off = c.getAttribute('data-off');
      if (anim) { requestAnimationFrame(function () { requestAnimationFrame(function () { c.style.strokeDashoffset = off; }); }); }
      else { c.style.transition = 'none'; c.style.strokeDashoffset = off; }
    })(rings[i]);
  }
  var hero = $id('hero');
  if (hero) {
    var layers = hero.querySelectorAll('[data-layer]');
    var F = { back: 5, mid: 10, front: 16 };
    hero.onmousemove = function (e) {
      var r = hero.getBoundingClientRect();
      var nx = ((e.clientX - r.left) / r.width - .5) * 2, ny = ((e.clientY - r.top) / r.height - .5) * 2;
      layers.forEach(function (g) {
        var k = F[g.getAttribute('data-layer')] || 5;
        g.style.transform = 'translate(' + (-nx * k).toFixed(1) + 'px,' + (-ny * k * .4).toFixed(1) + 'px)';
      });
    };
    hero.onmouseleave = function () { layers.forEach(function (g) { g.style.transform = 'translate(0,0)'; }); };
  }
  var fc = document.querySelector('.fcwrap');
  if (fc) {
    var svg = fc.querySelector('svg');
    var days = +fc.getAttribute('data-days');
    var G = fcGeom(days);
    var xl = fc.querySelector('.fc-x'), xd = fc.querySelector('.fc-dot'), tip = fc.querySelector('.fc-tip');
    svg.onmousemove = function (e) {
      var r = svg.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width * G.W;
      var i = Math.round(((x - G.PL) / (G.W - G.PL - G.PR)) * days);
      i = Math.max(0, Math.min(days, i));
      var xi = G.X(i), yi = G.Y(G.f.bal[i]);
      xl.setAttribute('x1', xi); xl.setAttribute('x2', xi); xl.style.display = '';
      xd.setAttribute('cx', xi); xd.setAttribute('cy', yi); xd.style.display = '';
      var day = G.f.byDay[i];
      tip.style.display = 'block';
      tip.style.left = (xi / G.W * 100) + '%';
      tip.style.top = (yi / G.H * 100) + '%';
      tip.innerHTML = '<b>' + dlabel(i) + '</b><p class="fm">' + money(G.f.bal[i], 0) + '</p>' +
        (day ? '<p class="fd ' + (day > 0 ? 'pos' : 'neg') + '">' + (day > 0 ? '+' : '\u2212') + money(Math.abs(day)) + ' that day</p>' : '');
    };
    svg.onmouseleave = function () { xl.style.display = 'none'; xd.style.display = 'none'; tip.style.display = 'none'; };
  }
}

      state.store[key] = list.filter(function (x) { return x.id !== d.id; });
      persist();
      toast('Expense “' + esc(item.name) + '” deleted', 'trash');
      render(false);
    }
  },
  'toggle-setting': function (d) {
    state.store.settings[d.key] = !state.store.settings[d.key]; persist(); render(false);
  },
  'save-profile': function () {
    var inp = $id('prof-name');
    var v = (inp ? inp.value : '').trim();
    state.store.profile = { name: v, initials: (v[0] || 'N').toUpperCase() };
    persist(); toast('Profile saved'); render(false);
  },
  'delete-transaction': function (d) {
    var tx = state.store.transactions.filter(function (x) { return x.id === d.id; })[0]; if (!tx) return;
    if (confirm('Delete transaction \u201c' + tx.name + '\u201d? This removes it from your history.')) {
      reverseTransactionApply(tx);
      state.store.transactions = state.store.transactions.filter(function (x) { return x.id !== d.id; });
      persist(); toast('Transaction deleted', 'trash');
      if (state.modal) closeModal(); render(false);
    }
  },
  'delete-income': function (d) {
    var s = state.store.incomeSources.filter(function (x) { return x.id === d.id; })[0]; if (!s) return;
    if (confirm('Delete income source \u201c' + s.name + '\u201d?')) {
      state.store.incomeSources = state.store.incomeSources.filter(function (x) { return x.id !== d.id; });
      persist(); toast('Income source deleted', 'trash'); render(false);
    }
  },
  'delete-owner-transfer': function (d) {
    if (confirm('Delete this owner transfer?')) {
      var t = state.store.ownerTransfers.filter(function (x) { return x.id === d.id; })[0];
      if (t) reverseOwnerTransferApply(t);
      state.store.ownerTransfers = state.store.ownerTransfers.filter(function (x) { return x.id !== d.id; });
      persist(); toast('Owner transfer deleted', 'trash'); render(false);
    }
  },
  'complete-owner-transfer': function (d) {
    var t = state.store.ownerTransfers.filter(function (x) { return x.id === d.id; })[0]; if (!t) return;
    t.status = 'completed'; t.updatedAt = new Date().toISOString();
    applyOwnerTransferIfCompleted(t);
    persist(); toast('Owner transfer marked completed'); render(false);
  },
  'delete-build-spend': function (d) {
    if (confirm('Delete this build spend entry?')) {
      state.store.buildSpend = state.store.buildSpend.filter(function (x) { return x.id !== d.id; });
      persist(); toast('Build spend deleted', 'trash'); render(false);
    }
  },
  'export-csv': function () {
    downloadFile('nofa-transactions.csv',
      ['Date,Name,Entity,Category,Amount,Status'].concat(state.store.transactions.map(function (t) {
        return t.date + ',"' + t.name + '",' + t.entity + ',' + (t.category || '') + ',' + t.amount.toFixed(2) + ',' + (t.status || 'posted');
      })).join('\n'));
    toast('Transactions exported as CSV', 'download');
  },
  'export-json': function () {
    downloadFile('nofa-data.json', JSON.stringify(state.store, null, 2), 'application/json');
    toast('Data exported as JSON', 'download');
  },
  'reset-data': function () {
    if (state.confirmReset) {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      state.store = JSON.parse(JSON.stringify(SEED));
      state.confirmReset = false;
      toast('Demo data restored', 'refresh'); render(false);
    } else {
      state.confirmReset = true; render(false);
      setTimeout(function () { if (state.confirmReset) { state.confirmReset = false; render(false); } }, 2800);
    }
  },
  'cancel-reset': function () { state.confirmReset = false; render(false); }
};

function reportUiError(context, err) {
  console.error(context, err);
  var b = $id('errbar');
  if (b) { b.style.display = 'flex'; b.querySelector('span').textContent = 'Error: ' + (err && err.message ? err.message : context); }
}
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!t) return;
  /* Respect data-stop boundaries (e.g. the modal box in modalShell()).
     Any click that starts inside a data-stop container must not trigger
     a data-action belonging to an ANCESTOR of that container (like the
     modal-backdrop's close-modal) -- only data-action elements that are
     inside (or are) the stop boundary itself may fire. This keeps clicks
     on inputs/labels/selects/plain space inside a modal from bubbling out
     and closing it, while clicking the backdrop itself, the X button, or
     Cancel (all inside or at the boundary) still works. */
  var stopBoundary = e.target.closest ? e.target.closest('[data-stop]') : null;
  if (stopBoundary && !stopBoundary.contains(t)) return;
  var fn = ACTIONS[t.getAttribute('data-action')];
  if (fn) {
    e.preventDefault();
    try { fn(t.dataset, t, e); }
    catch (err) { reportUiError('Action "' + t.getAttribute('data-action') + '" failed', err); }
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'tx-q') { state.txQ = e.target.value; renderTxBody(); }
  if (e.target.id === 'rec-q') { state.recQ = e.target.value; renderRecBody(); }
});

document.addEventListener('submit', function (e) {
  var f = e.target.closest ? e.target.closest('[data-form]') : null;
  if (!f) return;
  e.preventDefault();
  try {
  var data = {};
  new FormData(f).forEach(function (v, k) { data[k] = v; });
  var num = function (v) { return parseFloat(String(v).replace(/[^0-9.\-]/g, '')) || 0; };
  var type = f.getAttribute('data-form');
  if (type === 'add-account') {
    addAccount({ name: (data.name || '').trim() || 'New Account', entity: data.entity || 'business', type: data.type || 'Business Checking', balance: num(data.balance) });
    closeModal(); render(false);
  } else if (type === 'edit-account') {
    var a = findAcct(f.getAttribute('data-id')); if (!a) return;
    a.name = (data.name || '').trim() || a.name;
    var newBal = num(data.balance);
    /* Manually changing the balance here is a reconciliation: the new
       value becomes authoritative and is logged so it can be audited
       later; it must never be re-applied by the transaction engine. */
    if (Math.abs(newBal - (a.balance != null ? a.balance : 0)) >= 0.005) {
      var nowIsoRec = new Date().toISOString();
      state.store.balanceReconciliations.push({
        id: 'rec-' + Date.now(), accountId: a.id, previousBalance: a.balance, newBalance: newBal,
        date: todayISO(), createdAt: nowIsoRec
      });
      a.lastReconciledAt = nowIsoRec;
      a.balance = newBal;
    }
    persist(); toast('Account updated'); closeModal(); render(false);
  } else if (type === 'add-income') {
    var cadenceDaysMap = { 'Monthly': 30, 'Biweekly': 14, 'Weekly': 7, 'One-off': null, 'Variable': null };
    var cadenceVal = data.cadence || 'Monthly';
    var cashStatus = data.cashStatus || 'expected';
    state.store.incomeSources.push({
      id: 'i' + Date.now(), name: (data.name || '').trim() || 'New source', display: (data.display || '').trim() || '\u2014',
      cadence: cadenceVal, cadenceDays: cadenceDaysMap[cadenceVal] != null ? cadenceDaysMap[cadenceVal] : 30,
      amount: num(data.amount), entity: data.entity || 'business', cashStatus: cashStatus,
      nextDate: data.nextDate || null, note: (data.note || '').trim() || '\u2014', status: cashStatus === 'pipeline' ? 'planned' : 'active'
    });
    persist(); toast('Income source \u201c' + esc((data.name || '').trim() || 'New source') + '\u201d added'); closeModal(); render(false);
  } else if (type === 'edit-income') {
    var inc2 = state.store.incomeSources.filter(function (x) { return x.id === f.getAttribute('data-id'); })[0]; if (!inc2) return;
    var cadenceDaysMap2 = { 'Monthly': 30, 'Biweekly': 14, 'Weekly': 7, 'One-off': null, 'Variable': null };
    inc2.name = (data.name || '').trim() || inc2.name;
    inc2.display = (data.display || '').trim() || inc2.display;
    inc2.amount = num(data.amount);
    inc2.cadence = data.cadence || inc2.cadence;
    inc2.cadenceDays = cadenceDaysMap2[data.cadence] != null ? cadenceDaysMap2[data.cadence] : inc2.cadenceDays;
    inc2.cashStatus = data.cashStatus || inc2.cashStatus;
    inc2.nextDate = data.nextDate || null;
    inc2.note = (data.note || '').trim();
    inc2.status = inc2.cashStatus === 'pipeline' ? 'planned' : 'active';
    persist(); toast('Income source updated'); closeModal(); render(false);
  } else if (type === 'add-transaction') {
    var acc = findAcct(data.accountId) || state.store.accounts[0];
    var amt = num(data.amount);
    amt = data.txtype === 'expense' ? -Math.abs(amt) : Math.abs(amt);
    var nowIsoTx = new Date().toISOString();
    var newTx = {
      id: 'tx-' + Date.now(), accountId: acc ? acc.id : null, date: data.date || todayISO(),
      name: (data.name || '').trim() || 'Transaction', amount: amt, status: data.status === 'pending' ? 'pending' : 'posted',
      entity: acc ? acc.entity : 'business', category: (data.category || '').trim(), expenseType: '',
      clientProject: (data.clientProject || '').trim(), source: 'manual', notes: (data.notes || '').trim(),
      icon: amt > 0 ? 'banknote' : 'card', includedInBalance: false, balanceApplied: false, reconciliationId: null,
      createdAt: nowIsoTx, updatedAt: nowIsoTx
    };
    state.store.transactions.push(newTx);
    computeTransactionApply(newTx, data.alreadyIncluded === '1');
    persist(); toast('Transaction added'); closeModal(); render(false);
  } else if (type === 'edit-transaction') {
    var tx2 = state.store.transactions.filter(function (x) { return x.id === f.getAttribute('data-id'); })[0]; if (!tx2) return;
    /* Reverse using the OLD accountId/amount before mutating fields, then
       reapply using the NEW values -- a clean reverse-then-reapply so a
       balance is never double-counted across an edit. */
    reverseTransactionApply(tx2);
    var acc2 = findAcct(data.accountId) || findAcct(tx2.accountId);
    var amt2 = num(data.amount);
    amt2 = data.txtype === 'expense' ? -Math.abs(amt2) : Math.abs(amt2);
    tx2.accountId = acc2 ? acc2.id : tx2.accountId;
    tx2.entity = acc2 ? acc2.entity : tx2.entity;
    tx2.date = data.date || tx2.date;
    tx2.amount = amt2;
    tx2.name = (data.name || '').trim() || tx2.name;
    tx2.status = data.status === 'pending' ? 'pending' : 'posted';
    tx2.category = (data.category || '').trim();
    tx2.clientProject = (data.clientProject || '').trim();
    tx2.notes = (data.notes || '').trim();
    tx2.updatedAt = new Date().toISOString();
    computeTransactionApply(tx2, data.alreadyIncluded === '1');
    persist(); toast('Transaction updated'); closeModal(); render(false);
  } else if (type === 'add-owner-transfer') {
    var fromAcc = findAcct(data.fromAccountId);
    var toAcc = findAcct(data.toAccountId);
    var dir = (fromAcc && fromAcc.entity === 'personal') ? 'personal_to_nofa' : 'nofa_to_personal';
    var nowIsoOt = new Date().toISOString();
    var newOt = {
      id: 'ot-' + Date.now(), direction: dir, kind: dir === 'nofa_to_personal' ? 'withdrawal' : 'contribution',
      amount: num(data.amount), fromAccountId: fromAcc ? fromAcc.id : null, toAccountId: toAcc ? toAcc.id : null,
      date: data.date || todayISO(), status: data.status === 'completed' ? 'completed' : 'planned',
      includedInBalance: false, balanceApplied: false,
      note: (data.note || '').trim(), createdAt: nowIsoOt, updatedAt: nowIsoOt
    };
    state.store.ownerTransfers.push(newOt);
    applyOwnerTransferIfCompleted(newOt);
    persist(); toast('Owner transfer added'); closeModal(); render(false);
  } else if (type === 'add-build-spend') {
    var nowIsoBs = new Date().toISOString();
    state.store.buildSpend.push({ id: 'bs-' + Date.now(), date: data.date || todayISO(), vendor: (data.vendor || '').trim() || 'Build spend', amount: num(data.amount), note: (data.note || '').trim(), createdAt: nowIsoBs, updatedAt: nowIsoBs });
    persist(); toast('Build spend added'); closeModal(); render(false);
  } else if (type === 'add-expense') {
    var ent = data.entity === 'personal' ? 'personal' : 'business';
    var list = recurringList(ent);
    var nm = (data.name || '').trim() || 'New Expense';
    var day = String(Math.max(1, Math.min(31, parseInt(data.day, 10) || 1))).padStart(2, '0');
    list.push({
      id: (ent === 'business' ? 'rb-' : 'rp-') + Date.now(),
      day: day,
      name: nm,
      amount: num(data.amount),
      status: data.status || '',
      note: (data.note || '').trim()
    });
    persist(); toast('Expense “' + esc(nm) + '” added'); closeModal(); render(false);
  } else if (type === 'edit-expense') {
    var ent2 = f.getAttribute('data-entity') || 'business';
    var ex2 = recurringItem(ent2, f.getAttribute('data-id')); if (!ex2) return;
    ex2.day = String(Math.max(1, Math.min(31, parseInt(data.day, 10) || 1))).padStart(2, '0');
    ex2.name = (data.name || '').trim() || ex2.name;
    ex2.amount = num(data.amount);
    ex2.status = data.status || '';
    ex2.note = (data.note || '').trim();
    persist(); toast('Expense updated'); closeModal(); render(false);
  } else if (type === 'edit-goal') {
    var g = findGoal(f.getAttribute('data-id')); if (!g) return;
    if (data.current !== undefined) g.current = num(data.current);
    g.target = num(data.target) || 1;
    persist(); toast('Goal updated'); closeModal(); render(false);
  } else if (type === 'add-goal') {
    var name = (data.name || '').trim() || 'New Goal';
    state.store.goals.push({ id: 'g' + Date.now(), name: name, short: name.split(' ').slice(0, 2).join(' '), current: num(data.current), target: num(data.target) || 1, note: (data.note || '').trim() || 'Custom target', color: ['brand', 'grape', 'amber', 'teal'][state.store.goals.length % 4], mode: 'save' });
    persist(); toast('Goal \u201c' + esc(name) + '\u201d added'); closeModal(); render(false);
  }
  } catch (err) { reportUiError('Saving "' + f.getAttribute('data-form') + '" failed', err); }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (state.modal) closeModal();
    else if (state.sidebarOpen) setSidebar(false);
  }
});

/* Init */
render(true);
})();
</script>
</body>
